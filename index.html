    <script>(function(){
      var b=document.createElement('base');
      if(location.hostname.endsWith('github.io')){
        var s=location.pathname.split('/').filter(Boolean);
        b.href=s.length>0?'/'+s[0]+'/':'/';
      }else{
        b.href='/';
      }
      document.head.insertBefore(b,document.head.firstChild);
      var currentBuild='1794622673715';
      var prevBuild=localStorage.getItem('mirsad_deployed_build_id');
      if(prevBuild && prevBuild!==currentBuild){
        localStorage.setItem('mirsad_deployed_build_id',currentBuild);
        if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
      }else if(!prevBuild){
        localStorage.setItem('mirsad_deployed_build_id',currentBuild);
      }
      fetch(b.href+'version.json?t='+Date.now(),{cache:'no-store'})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(data){
          if(data&&data.buildId&&data.buildId!==localStorage.getItem('mirsad_deployed_build_id')){
            localStorage.setItem('mirsad_deployed_build_id',data.buildId);
            if('caches' in window){
              caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));})
                .then(function(){location.reload();});
            }else{
              location.reload();
            }
          }
        }).catch(function(){});
    })();</script>

    <script>
      (function () {
        // 1. استعادة المسار الأصلي في GitHub Pages بعد التحويل من 404.html
        try {
          var savedRedirect = sessionStorage.getItem('mirsad_gh_redirect');
          if (savedRedirect) {
            sessionStorage.removeItem('mirsad_gh_redirect');
            window.history.replaceState(null, '', savedRedirect);
          }
        } catch (e) {}

        // 2. تنظيف أي Service Worker قديم عالق في متصفح المستخدم على GitHub Pages لمرة واحدة
        try {
          if (
            window.location.hostname.endsWith('github.io') &&
            localStorage.getItem('mirsad_gh_sw_purge_v6') !== '1'
          ) {
            localStorage.setItem('mirsad_gh_sw_purge_v6', '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) {
                  r.unregister();
                });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) {
                  caches.delete(k);
                });
              });
            }
          }
        } catch (e) {}

        // 3. منع أخطاء WebSocket الخاصة بـ Vite HMR في البيئات السحابية التي تعطل HMR

          var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1
          ) {
            e.preventDefault();
          }
        });
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          function PatchedWebSocket(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              var dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.url = String(url || '');
              dummy.protocol = protoStr;
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.binaryType = 'blob';
              dummy.send = function () {};
              dummy.close = function () {
                dummy.readyState = 3;
              };
              return dummy;
            }
            return protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
          }
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }
      })();
