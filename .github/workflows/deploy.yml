name: Force Build and Deploy Mirsad (Netlify & GitHub Pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "mirsad-force-deploy-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build_and_force_deploy:
    name: Build & Force Deploy (No Skip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (Required for Vite 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify source data and TypeScript types
        run: |
          test -d src/data || (echo "ERROR: src/data directory is missing from repository!" && exit 1)
          npm run lint

      - name: Build production bundle
        env:
          CI: false
        run: npm run build

      - name: Push built dist to gh-pages branch (Prevents dynamic deploy skip)
        continue-on-error: true
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A --force
          git commit --allow-empty -m "Force deploy build $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Deploy directly to Netlify (when secrets are configured)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            npx --yes netlify-cli deploy --prod --dir=dist --functions=netlify/functions
          else
            echo "Skipping direct Netlify CLI deploy (NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set)."
          fi
